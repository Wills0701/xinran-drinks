name: Publish drink picker

on:
  push:
  workflow_dispatch:
  schedule:
    # UTC: Beijing 00:17, 02:17, 08:17 and 14:17.
    - cron: '17 0,6,16,18 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read today's Aries horoscope
        run: python scripts/update_horoscope.py
      - name: Read today's almanac
        run: python scripts/update_almanac.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
