body{padding:34px 22px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.card,.fortune{flex-shrink:0;width:min(100%,430px)}.card{padding:29px 29px 20px}
h1{margin-bottom:11px}.result{position:relative;min-height:187px;padding:20px 0}.drink{font-size:28px}.eyebrow{margin-bottom:17px}
.picker-label{margin:25px 0 11px;font-size:11px;letter-spacing:1px;color:#9a8569}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.filter{padding:8px 7px;border:1px solid #e7dcc5;border-radius:10px;font:inherit;font-size:11px;background:#fffcf5;color:#9a8569;cursor:pointer;transition:background .15s}
.filter[aria-pressed="true"]{border-color:#d5b76c;background:#f8e9b9;color:#705631;font-weight:600}
.filter:hover{background:#f8edcf}.filter:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #aa8750;outline-offset:3px}
.links{margin-top:17px}.motion-control{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10px;color:#a38c70;margin-top:20px;cursor:pointer;user-select:none}
.motion-control input{width:12px;height:12px;accent-color:#c7a45c;margin:0}.motion-control:has(input:disabled){opacity:.6}
.draw-scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.draw-character{display:block;width:90px;height:110px;background-repeat:no-repeat;background-position:center;background-size:contain;animation:usagi-hop .28s ease-in-out infinite alternate}
.draw-character.car{background-size:200% 100%;background-position:left center;width:85px;height:110px}
body.busy .result{opacity:1}body.busy .result-copy{opacity:.08}body.busy .draw-scene{display:flex}body.busy .draw{animation:none}
@keyframes usagi-hop{from{transform:translateY(5px) rotate(-7deg)}to{transform:translateY(-8px) rotate(7deg)}}
.fortune{padding:23px 25px 20px;border:1px solid #e6d8b5;border-radius:22px;background:rgba(255,254,248,.66);backdrop-filter:blur(.5px);text-align:left;box-shadow:0 8px 40px #8c703609}
.fortune-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.fortune h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0;letter-spacing:1px}.aries{font-size:22px;font-weight:400;color:#b79b64;line-height:1}.fortune time{font-size:10px;color:#ad9778;letter-spacing:.5px}
.fortune-text{font-size:12px;line-height:1.9;color:#8d785e;margin:17px 0 16px;min-height:46px;overflow-wrap:anywhere}

.fortune-lucky{display:flex;justify-content:center;gap:23px;margin:13px 0 0;font-size:10px;color:#a38b6c}.fortune-lucky b{font-weight:500;color:#7f684a;margin-left:5px}
.fortune-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;font-size:9px;line-height:1.7;color:#b3a184}.fortune a{color:#a38a64;text-decoration:none;white-space:nowrap}.fortune a:hover{text-decoration:underline}.fortune-retry{border:0;background:transparent;font:inherit;color:#9b7a41;padding:2px 0;cursor:pointer;text-decoration:underline;margin-left:7px}.fortune-note{margin:9px 0 0;font-size:9px;color:#b3a184;text-align:center;letter-spacing:.5px}
@media(max-width:430px){body{padding:27px 22px;gap:16px}.card{padding:27px 23px 19px}.drink{font-size:26px}.result{min-height:178px}.picker-label{margin-top:23px}.fortune{padding:21px 22px 18px}.fortune-lucky{gap:20px}.fortune-bottom{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Three randomly selected Usagi draw effects; the existing wallpaper stays still. */
.draw-scene{overflow:hidden;border-radius:14px}
.draw-scene::before,.draw-scene::after{position:absolute;pointer-events:none}
.effect-twirl .draw-character{width:104px;height:104px;animation:usagi-twirl 1400ms ease-in-out both}
.effect-twirl::before,.effect-twirl::after{content:"✦";color:#d9b864;font-size:21px;top:34%;left:calc(50% - 76px);animation:usagi-sparkle 1400ms ease-in-out both}
.effect-twirl::after{font-size:14px;top:59%;left:calc(50% + 59px);animation-delay:120ms}
.effect-drive .draw-character{animation:usagi-drive 1450ms ease-in-out both,usagi-car-frames 180ms steps(1) infinite;z-index:1}
.effect-drive::before{content:"";width:84%;height:1px;left:8%;top:calc(50% + 43px);background:repeating-linear-gradient(90deg,#d7c499 0 14px,transparent 14px 23px);opacity:.55}
.effect-drive::after{content:"";width:16px;height:7px;border:1px solid #d6bf8b;border-radius:50%;top:calc(50% + 30px);left:30%;box-shadow:-16px 4px 0 -1px #e5d3a8;animation:usagi-dust 1450ms ease-out both}
@keyframes usagi-twirl{0%{transform:translateY(9px) rotate(-25deg) scale(.7);opacity:0}14%{opacity:1}48%{transform:translateY(-12px) rotate(345deg) scale(1.03)}86%{transform:translateY(0) rotate(710deg) scale(1)}100%{transform:translateY(3px) rotate(720deg) scale(.94);opacity:1}}
@keyframes usagi-sparkle{0%,14%,100%{opacity:0;transform:scale(.3) rotate(-20deg)}38%,67%{opacity:.8;transform:scale(1) rotate(12deg)}}
@keyframes usagi-drive{0%{transform:translate(-155px,0) rotate(-4deg);opacity:0}14%{opacity:1}40%{transform:translate(-20px,-4px) rotate(2deg)}65%{transform:translate(30px,0) rotate(-2deg)}87%{opacity:1}100%{transform:translate(155px,-3px) rotate(3deg);opacity:0}}
@keyframes usagi-car-frames{0%,100%{background-position:left center}50%{background-position:right center}}
@keyframes usagi-dust{0%,20%{opacity:0;transform:translateX(-10px) scale(.4)}42%{opacity:.65;transform:translateX(0) scale(1)}82%,100%{opacity:0;transform:translateX(-38px) scale(1.8)}}
@media(prefers-reduced-motion:reduce){.draw-character,.draw-scene::before,.draw-scene::after{animation:none!important}}

.store{display:flex;align-items:center;justify-content:center;gap:8px;min-height:28px}
.store-logo{width:28px;height:28px;flex-shrink:0;object-fit:contain;border-radius:50%;background:#fff;border:1px solid #eee8db}
.fortune-intro{font-size:9px;letter-spacing:1.5px;color:#b09a77;margin:18px 0 6px}
.fortune-text{margin:0 0 17px;line-height:1.9;min-height:0;color:#806b50}
.fortune-details{margin:0;padding:4px 0;border-top:1px solid #eae1cc;border-bottom:1px solid #eae1cc}
.fortune-details>div{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px 0}
.fortune-details>div+div{border-top:1px dashed #ece3d0}
.fortune-details dt{font-size:10px;letter-spacing:1px;color:#aa9270;padding-top:2px}
.fortune-details dd{margin:0;font-size:11px;line-height:1.9;color:#8d785e;overflow-wrap:anywhere}

body{padding-top:86px}
.theme-switcher{position:fixed;top:16px;left:16px;z-index:10;display:flex;gap:3px;padding:4px;border:1px solid #e4d5b5;border-radius:24px;background:rgba(255,253,242,.94);box-shadow:0 3px 15px #8c703610;backdrop-filter:blur(8px)}
.theme-button{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:19px;padding:5px 11px 5px 7px;background:transparent;font:inherit;font-size:11px;line-height:1.4;color:#a08b6f;cursor:pointer}
.theme-button[aria-pressed="true"]{color:#74582e;background:#f7e7b2;border-color:#e7d296;box-shadow:0 1px 3px #80633b10}
.theme-button:hover{color:#735533;background:#f9efd5}
.theme-avatar{width:23px;height:25px;background-repeat:no-repeat;background-position:center;background-size:contain;flex-shrink:0}
.theme-avatar.usagi-avatar{background-image:var(--usagi-avatar)}
.theme-avatar.purin-avatar{background-image:var(--purin-art)}
h1{font-family:"Xinran Happy","Hiragino Maru Gothic ProN","PingFang SC",sans-serif;font-size:29px;font-weight:400;letter-spacing:1px;line-height:1.5;margin:0 0 8px;display:flex;align-items:center;justify-content:center;gap:1px;color:#8d6b37;text-shadow:1px 2px 0 #fff9df}
.title-letter{display:inline-block;transform:rotate(-3deg)}
.title-letter:nth-child(3n){transform:translateY(-2px) rotate(4deg)}
.title-letter:nth-child(3n+2){transform:translateY(1px) rotate(1deg)}
h1::before,h1::after{content:"✦";font:12px sans-serif;color:#cfad63;margin:0 6px;transform:rotate(14deg)}
h1::after{font-size:9px;transform:translateY(-9px) rotate(-12deg)}
html[data-theme="purin"]{--stand:var(--purin-art);--candy:var(--purin-art);--car:var(--purin-art);color:#6d4934}
html[data-theme="purin"] body{background:#fff4d3;color:#6d4934}
html[data-theme="purin"] .wallpaper{opacity:.25}
html[data-theme="purin"] .stamp{background-size:contain;background-position:center;width:111px;height:120px;filter:saturate(.75)}

html[data-theme="purin"] .stamp:nth-child(4n){width:96px;height:105px}
html[data-theme="purin"] .card,html[data-theme="purin"] .fortune{background:rgba(255,253,235,.62);border-color:#ddc5a1;box-shadow:0 12px 50px #9564340b,0 3px 0 #d3b07924}
html[data-theme="purin"] h1{color:#85512e;text-shadow:1px 2px 0 #fff7d1}
html[data-theme="purin"] .draw{background:#edcc83;border-color:#bb955a;box-shadow:0 3px 0 #c8a66b;color:#754d2d}
html[data-theme="purin"] .draw:hover{background:#f1d799}
html[data-theme="purin"] .filter{background:#fff9e8;border-color:#e7d8bc;color:#9b795b}
html[data-theme="purin"] .filter[aria-pressed="true"]{background:#efdaaa;border-color:#c9a46e;color:#785331}
html[data-theme="purin"] .theme-switcher{background:rgba(255,248,225,.95);border-color:#dcc29b}
html[data-theme="purin"] .theme-button[aria-pressed="true"]{background:#ecd29c;border-color:#d6b880;color:#754a2c}
html[data-theme="purin"] .drink{color:#714b32}
html[data-theme="purin"] .store,html[data-theme="purin"] .fortune-text,html[data-theme="purin"] .fortune-details dd{color:#8b6749}
html[data-theme="purin"] .fortune-details,html[data-theme="purin"] .fortune-details>div+div{border-color:#e4d1b2}
html[data-theme="purin"] .motion-control input{accent-color:#b58a4f}
html[data-theme="purin"] .draw-character{width:108px;height:112px;background-size:contain;background-position:center}
html[data-theme="purin"] .effect-drive .draw-character{animation:purin-stroll 1450ms ease-in-out both}
html[data-theme="purin"] .effect-drive::before{background:repeating-linear-gradient(90deg,#c5a97a 0 10px,transparent 10px 23px)}
@keyframes purin-stroll{0%{opacity:0;transform:translateX(-145px) rotate(-8deg)}15%{opacity:1}30%{transform:translateX(-65px) translateY(-6px) rotate(7deg)}50%{transform:translateX(0) translateY(0) rotate(-7deg)}70%{transform:translateX(65px) translateY(-6px) rotate(7deg)}85%{opacity:1}100%{opacity:0;transform:translateX(145px) rotate(-8deg)}}
@media(max-width:430px){body{padding-top:78px}.theme-switcher{top:12px;left:14px}.theme-button{font-size:10px;padding-right:9px}h1{font-size:27px;gap:0}h1::before,h1::after{margin:0 4px}}

/* Icon-only theme switch: one sliding indicator and a selected-character hop. */
.theme-switcher{gap:2px;isolation:isolate;overflow:visible}
.theme-switcher::before{content:"";position:absolute;left:4px;top:4px;width:44px;height:44px;border:1px solid #e7d296;border-radius:50%;background:#f7e7b2;box-shadow:0 2px 5px #80633b13;transform:translateX(0);transition:transform .38s cubic-bezier(.22,1,.36,1),background-color .3s,border-color .3s;z-index:-1;pointer-events:none}
.theme-switcher .theme-button{width:44px;height:44px;padding:5px;gap:0;border:0;border-radius:50%;background:transparent;box-shadow:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.theme-switcher .theme-button[aria-pressed="true"],.theme-switcher .theme-button:hover{background:transparent;border:0;box-shadow:none}
.theme-avatar{width:29px;height:33px;transform-origin:50% 90%;opacity:.65;transition:opacity .25s,filter .25s;will-change:transform}
.theme-button[aria-pressed="true"] .theme-avatar,.theme-button:hover .theme-avatar{opacity:1}
.theme-button:focus-visible{outline:2px solid #aa8750;outline-offset:3px}
html[data-theme="purin"] .theme-switcher::before{transform:translateX(46px);background:#ecd29c;border-color:#d6b880}
html[data-theme="purin"] .theme-switcher .theme-button[aria-pressed="true"]{background:transparent;border:0;box-shadow:none}
.theme-button.is-jumping .theme-avatar{animation:theme-character-jump .65s cubic-bezier(.35,0,.25,1) both}
@keyframes theme-character-jump{0%{transform:translateY(0) scale(1) rotate(0)}18%{transform:translateY(3px) scale(1.12,.88) rotate(-3deg)}43%{transform:translateY(-18px) scale(.97,1.05) rotate(-8deg)}60%{transform:translateY(-15px) scale(1) rotate(5deg)}82%{transform:translateY(1px) scale(1.12,.88) rotate(0)}100%{transform:translateY(0) scale(1) rotate(0)}}
body,.card,.fortune,.filter,h1,.drink{transition:background-color .35s ease,border-color .35s ease,color .35s ease,box-shadow .35s ease}
@media(max-width:430px){.theme-switcher .theme-button{width:44px;height:44px;padding:5px}}
@media(prefers-reduced-motion:reduce){.theme-switcher::before,.theme-avatar,body,.card,.fortune,.filter,h1,.drink{transition:none!important}.theme-button.is-jumping .theme-avatar{animation:none!important}}

/* Keep the drink picker prominent; make the daily fortune more compact. */
.fortune{width:min(100%,390px);padding:19px 22px 16px;border-radius:20px}
.fortune h2{font-size:12px;letter-spacing:.6px}
.fortune .aries{font-size:20px}
.fortune-intro{margin-top:13px;margin-bottom:5px}
.fortune-text{font-size:11px;line-height:1.8;margin-bottom:12px}
.fortune-details{padding:2px 0}
.fortune-details>div{padding:9px 0;gap:9px;grid-template-columns:28px minmax(0,1fr)}
.fortune-details dd{font-size:11px;line-height:1.75}
.fortune-lucky{margin-top:10px;gap:20px}
.fortune-bottom{margin-top:11px}
.fortune-note{margin-top:6px}
@media(max-width:430px){.fortune{width:calc(100% - 20px);max-width:390px;padding:18px 18px 14px}.fortune-heading{gap:8px}.fortune h2{font-size:12px;letter-spacing:0}.fortune time{font-size:9px}.fortune-details>div{padding:8px 0;gap:8px}}

/* Two daily cards share equal columns, equal heights, and aligned baselines. */
.daily-grid{width:min(100%,430px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}
.daily-grid .daily-card{width:100%;max-width:none;min-width:0;min-height:236px;padding:17px 16px 14px;border:1px solid #e6d8b5;border-radius:20px;background:rgba(255,254,248,.66);backdrop-filter:blur(.5px);box-shadow:0 8px 40px #8c703609;text-align:left;display:flex;flex-direction:column}
.daily-grid .daily-heading{display:flex;align-items:center;min-height:20px;gap:0}
.daily-grid h2{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:20px;letter-spacing:.2px;margin:0;white-space:nowrap}
.daily-grid .aries{font-size:19px;line-height:20px}
.daily-grid .daily-date{display:block;font-size:9px;line-height:12px;letter-spacing:.6px;color:#ad9778;margin:7px 0 14px}
.daily-content{flex:1;min-width:0}
.mini-kicker{margin:0 0 5px;font-size:9px;color:#aa9374;letter-spacing:.5px}
.daily-grid .fortune-text,.mini-loading{font-size:11px;line-height:1.8;color:#806b50;margin:0;min-height:0;overflow-wrap:anywhere}
.daily-grid .fortune-lucky{display:flex;flex-direction:column;gap:6px;font-size:10px;line-height:16px;margin:12px 0 0;align-items:stretch}
.daily-grid .fortune-lucky>span{display:flex;justify-content:space-between;gap:8px}
.daily-grid .fortune-lucky b{font-weight:500;margin-left:0}
.mini-status{min-height:12px;margin-top:12px;font-size:8px;line-height:12px;color:#b3a184}
.mini-status .fortune-retry{font-size:9px;margin-left:5px}
.mini-footer{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:8px;line-height:14px;color:#b3a184;border-top:1px solid #eae1cc;margin-top:8px;padding-top:9px}
.mini-footer a{color:#a38a64;text-decoration:none;white-space:nowrap}
.mini-footer a:hover{text-decoration:underline}
.calendar-mark{display:inline-flex;width:17px;height:18px;align-items:center;justify-content:center;border:1px solid #b79b64;border-top-width:3px;border-radius:3px;color:#b79b64;font-size:9px;font-weight:500;line-height:1}
.lunar-date{display:flex;align-items:baseline;gap:6px;margin:0 0 15px;color:#8d785e;font-size:9px}
.lunar-date b{font-size:13px;font-weight:500;color:#80643a;letter-spacing:.3px}
.almanac-list{margin:0;display:grid;gap:10px}
.almanac-list>div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;align-items:start}
.almanac-list dt{width:18px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;line-height:19px}
.almanac-list .yi{background:#e8eddd;color:#879267}.almanac-list .ji{background:#f1e5df;color:#a18476}
.almanac-list dd{margin:0;font-size:11px;line-height:19px;color:#8d785e;overflow-wrap:anywhere}
html[data-theme="purin"] .daily-grid .daily-card{background:rgba(255,253,235,.62);border-color:#ddc5a1;box-shadow:0 12px 50px #9564340b,0 3px 0 #d3b07924}
html[data-theme="purin"] .almanac{color:#6d4934}
html[data-theme="purin"] .mini-footer{border-color:#e4d1b2}
.almanac{transition:background-color .35s ease,border-color .35s ease,color .35s ease,box-shadow .35s ease}
@media(max-width:430px){.daily-grid{gap:10px}.daily-grid .daily-card{padding:15px 12px 12px;border-radius:18px}.daily-grid h2{font-size:11px;gap:5px}.daily-grid .daily-date{margin-bottom:12px}.lunar-date{gap:5px}.lunar-date b{font-size:12px}.daily-grid .fortune-text,.almanac-list dd{font-size:11px}}
@media(prefers-reduced-motion:reduce){.almanac{transition:none!important}}

function applyTheme(next,{animate=false}={}){

 ['usagi','purin'].forEach(key=>$('theme-'+key).classList.remove('is-jumping'));

 $('theme-purin').setAttribute('aria-pressed',String(theme==='purin'));
 if(changed&&animate&&!motionQuery.matches){$('theme-'+theme).classList.add('is-jumping');animateThemeCards();animateTitlePet()}
 $('motion-label').textContent=THEMES[theme].label+'抽签动效';
 try{localStorage.setItem(THEME_KEY,theme)}catch{}

function categoryOf(s,p){
 const n=p.name;
 if(n.startsWith('固体')||n.includes('芭菲杯')||pureTea.has(n))return 'other';
 if(/拿铁|美式|咖啡|鸳鸯/.test(n))return 'coffee';

 if(/奶|牛乳|米乳|奶昔|冰酪|慕斯|麻薯|阿华田|可可|抹茶|黑糖|豆乳/.test(n))return 'milk';
 if(fruitSpecial.has(n)||/柠|冻柠|鲜橙|水果|果茶|果汁|葡萄|青提茉莉|西瓜|大瓜|杨枝甘露|凤梨|芒芒|百香|马蹄|龙眼|青梅|荔枝|芭乐|苹果鲜茶|事事橙/.test(n))return 'fruit';
 // These menus use poetic names for fresh-milk teas; the full original names stay intact.

}

const FAVORITE_STORES=new Set(S.filter(s=>s.brand==='霸王茶姬'||s.name.includes('霸王茶姬')).map(s=>s.id));
function preferenceWeight(p){
 const brand=FAVORITE_STORES.has(p.store),apple=p.name.includes('苹果');
 // 伯牙绝弦 is jasmine tea (CHAGEE official product description).
 const jasmine=/茉莉|伯牙绝弦/.test(p.name);
 return Math.min(1.5,1+0.25*Number(brand)+0.25*Number(apple)+0.25*Number(jasmine));
}
function weightedChoices(pool,previous=current){
 const withoutLast=pool.filter(p=>!previous||p.store!==previous.store||p.name!==previous.name);
 const choices=withoutLast.length?withoutLast:pool,counts=new Map();
 choices.forEach(p=>counts.set(p.store,(counts.get(p.store)||0)+1));
 // Preserve the equal-store baseline, then apply the modest item preferences.
 return choices.map(p=>({item:p,weight:preferenceWeight(p)/counts.get(p.store)}));
}
function pickDrink(pool,previous=current,random=Math.random){
 const entries=weightedChoices(pool,previous);if(!entries.length)return null;
 let ticket=random()*entries.reduce((sum,e)=>sum+e.weight,0);
 for(const entry of entries){ticket-=entry.weight;if(ticket<0)return entry.item}
 return entries[entries.length-1].item;
}

function render(){
 $('date').textContent=new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'});
 document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));
 $('motion').checked=motion&&!motionQuery.matches;$('motion').disabled=motionQuery.matches;
 const s=current&&S.find(s=>s.id===current.store),p=s&&s.products.find(p=>p.name===current.name);
 $('store-logo').classList.toggle('hidden',!p);if(p)$('store-logo').src=BRAND_LOGOS[s.brand];
 if(!p){current=null;$('drink').textContent='今天喝什么？';$('store').textContent=category==='all'?'点一下，随机选一杯。':'选好了口味，抽一杯吧。';$('draw').textContent='随机一杯';$('links').classList.add('hidden')}
 else{$('drink').textContent=p.name;$('store').textContent=s.name;$('draw').textContent='再随机一杯';$('order').classList.toggle('hidden',!s.orderUrl);if(s.orderUrl)$('order').href=s.orderUrl;$('links').classList.toggle('hidden',!s.orderUrl)}
 $('draw').disabled=busy||!poolFor().length;
 if(!poolFor().length){$('drink').textContent='这个分类还没有饮品';$('store').textContent='换个口味试试。'}
 if(busy)$('draw').textContent=THEMES[theme].busy;
}
const DRAW_ANIMATIONS=[
 {id:'hop',pose:'stand',duration:1200},
 {id:'twirl',pose:'candy',duration:1400},
 {id:'drive',pose:'car',duration:1450}
];
function chooseDrawAnimation(random=Math.random){return DRAW_ANIMATIONS[Math.floor(random()*DRAW_ANIMATIONS.length)]}
function startDrawAnimation(){
 const effect=chooseDrawAnimation();
 $('draw-scene').className='draw-scene effect-'+effect.id;
 $('draw-character').className='draw-character '+effect.pose;
 if(effect.id==='hop'){
  const poses=['stand','candy','car'];let frame=0;
  frames=setInterval(()=>{$('draw-character').className='draw-character '+poses[++frame%poses.length]},200);
 }
 timer=setTimeout(()=>endDraw(),effect.duration);
}
function endDraw(commit=true){
 clearTimeout(timer);clearInterval(frames);timer=null;frames=null;
 $('draw-scene').className='draw-scene';$('draw-character').className='draw-character stand';
 if(commit&&pending){current=pending;currentDay=today();persist()}
 pending=null;busy=false;document.body.classList.remove('busy');$('result').setAttribute('aria-busy','false');render();
}
function draw(){
 if(busy)return;
 syncDay();const pool=poolFor();if(!pool.length)return;
 const pick=pickDrink(pool,current);
 pending={store:pick.store,name:pick.name};
 if(!motion||motionQuery.matches){endDraw();return}
 busy=true;document.body.classList.add('busy');$('result').setAttribute('aria-busy','true');render();
 startDrawAnimation();
}
$('draw').onclick=draw;
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{
 if(b.dataset.category===category)return;
 if(busy)endDraw(false);
 category=b.dataset.category;
 const c=current&&ALL.find(p=>p.store===current.store&&p.name===current.name);
 if(c&&category!=='all'&&c.category!==category)current=null;
 persist();render();
});
$('motion').onchange=()=>{motion=$('motion').checked;persist();if(busy&&!motion)endDraw();render()};
motionQuery.addEventListener('change',()=>{if(motionQuery.matches){stopThemeCardMotion();stopTitlePetMotion();if(busy)endDraw()}render()});
function syncDay(){if(currentDay!==today()){if(busy)endDraw(false);current=null;currentDay=today();persist()}render()}

let horoscopeRequest=0,horoscopeDate='',horoscopeBusy=false,horoscopeLastAttempt=0;
function sourceLink(day){return 'https://www.1212.com/luck/aries/'+day.replaceAll('-','')+'.html'}
function horoscopeShell(day){
 $('fortune-date').textContent=day.slice(5).replace('-','.');$('fortune-source').href=sourceLink(day);
 $('fortune-details').classList.add('hidden');$('fortune-lucky').classList.add('hidden');
 $('fortune-text').textContent='正在获取…';$('fortune-status').textContent='';$('fortune-retry').classList.add('hidden');
}
function showHoroscope(data,day,cached=false){
 if(data.sign!=='aries'||data.date!==day||!data.insights||!['综合','感情','工作','生活'].every(k=>typeof data.insights[k]==='string'&&data.insights[k].trim())||!data.color||!data.number)throw Error('Invalid horoscope');
 $('fortune-text').textContent=data.insights['综合'].split(/[。！？]/)[0]+'。';
 $('fortune-color').textContent=data.color;$('fortune-number').textContent=data.number;
 $('fortune-details').classList.remove('hidden');$('fortune-lucky').classList.remove('hidden');
 $('fortune-status').textContent=cached?'今日缓存':'今日已更新';
 $('fortune-retry').classList.toggle('hidden',!cached);
}
async function loadHoroscope(){
 const day=today(),request=++horoscopeRequest;horoscopeDate=day;horoscopeBusy=true;horoscopeLastAttempt=Date.now();horoscopeShell(day);
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),16000);
 try{
  if(location.protocol==='file:')throw Error('Server required');
  const res=await fetch('./horoscope.json',{signal:controller.signal,cache:'no-store'});
  if(!res.ok)throw Error('Unavailable');const data=await res.json();
  if(request!==horoscopeRequest||day!==today())return;
  showHoroscope(data,day);try{localStorage.setItem('xinran-aries-cache-v2',JSON.stringify(data))}catch{}
 }catch{
  if(request!==horoscopeRequest||day!==today())return;
  let cached;try{cached=JSON.parse(localStorage.getItem('xinran-aries-cache-v2')||'null')}catch{}
  try{showHoroscope(cached,day,true)}catch{
   $('fortune-text').textContent='暂时未获取，稍后再试。';$('fortune-status').textContent='可点原文查看';$('fortune-retry').classList.remove('hidden');
  }
 }finally{clearTimeout(timeout);if(request===horoscopeRequest)horoscopeBusy=false}
}
$('fortune-retry').onclick=loadHoroscope;
