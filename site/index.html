body{padding:34px 22px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.card,.fortune{flex-shrink:0;width:min(100%,430px)}.card{padding:29px 29px 20px}
h1{margin-bottom:11px}.result{position:relative;min-height:187px;padding:20px 0}.drink{font-size:28px}.eyebrow{margin-bottom:17px}
.picker-label{margin:25px 0 11px;font-size:11px;letter-spacing:1px;color:#9a8569}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.filter{padding:8px 7px;border:1px solid #e7dcc5;border-radius:10px;font:inherit;font-size:11px;background:#fffcf5;color:#9a8569;cursor:pointer;transition:background .15s}
.filter[aria-pressed="true"]{border-color:#d5b76c;background:#f8e9b9;color:#705631;font-weight:600}
.filter:hover{background:#f8edcf}.filter:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #aa8750;outline-offset:3px}
.links{margin-top:17px}.motion-control{display:flex;justify-content:center;align-items:center;gap:6px;font-size:10px;color:#a38c70;margin-top:20px;cursor:pointer;user-select:none}
.motion-control input{width:12px;height:12px;accent-color:#c7a45c;margin:0}.motion-control:has(input:disabled){opacity:.6}
.draw-scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.draw-character{display:block;width:90px;height:110px;background-repeat:no-repeat;background-position:center;background-size:contain;animation:usagi-hop .28s ease-in-out infinite alternate}
.draw-character.car{background-size:200% 100%;background-position:left center;width:85px;height:110px}
body.busy .result{opacity:1}body.busy .result-copy{opacity:.08}body.busy .draw-scene{display:flex}body.busy .draw{animation:none}
@keyframes usagi-hop{from{transform:translateY(5px) rotate(-7deg)}to{transform:translateY(-8px) rotate(7deg)}}
.fortune{padding:23px 25px 20px;border:1px solid #e6d8b5;border-radius:22px;background:rgba(255,254,248,.88);backdrop-filter:blur(2px);text-align:left;box-shadow:0 8px 40px #8c703609}
.fortune-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.fortune h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0;letter-spacing:1px}.aries{font-size:22px;font-weight:400;color:#b79b64;line-height:1}.fortune time{font-size:10px;color:#ad9778;letter-spacing:.5px}

const ALL=S.flatMap(s=>s.products.map(p=>({store:s.id,name:p.name,category:categoryOf(s,p)})));
function poolFor(c=category){return ALL.filter(p=>c==='all'||p.category===c)}

const FAVORITE_STORES=new Set(S.filter(s=>s.brand==='霸王茶姬'||s.name.includes('霸王茶姬')).map(s=>s.id));
function preferenceWeight(p){
 const brand=FAVORITE_STORES.has(p.store),apple=p.name.includes('苹果');
 // 伯牙绝弦 is jasmine tea (CHAGEE official product description).
 const jasmine=/茉莉|伯牙绝弦/.test(p.name);
 return Math.min(1.5,1+0.25*Number(brand)+0.25*Number(apple)+0.25*Number(jasmine));
}
function weightedChoices(pool,previous=current){
 const withoutLast=pool.filter(p=>!previous||p.store!==previous.store||p.name!==previous.name);
 const choices=withoutLast.length?withoutLast:pool,counts=new Map();
 choices.forEach(p=>counts.set(p.store,(counts.get(p.store)||0)+1));
 // Preserve the equal-store baseline, then apply the modest item preferences.
 return choices.map(p=>({item:p,weight:preferenceWeight(p)/counts.get(p.store)}));
}
function pickDrink(pool,previous=current,random=Math.random){
 const entries=weightedChoices(pool,previous);if(!entries.length)return null;
 let ticket=random()*entries.reduce((sum,e)=>sum+e.weight,0);
 for(const entry of entries){ticket-=entry.weight;if(ticket<0)return entry.item}
 return entries[entries.length-1].item;
}

function render(){
 $('date').textContent=new Date().toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'});
 document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));
 $('motion').checked=motion&&!motionQuery.matches;$('motion').disabled=motionQuery.matches;
 const s=current&&S.find(s=>s.id===current.store),p=s&&s.products.find(p=>p.name===current.name);
 $('store-logo').classList.toggle('hidden',!p);if(p)$('store-logo').src=BRAND_LOGOS[s.brand];
 if(!p){current=null;$('drink').textContent='今天喝什么？';$('store').textContent=category==='all'?'点一下，随机选一杯。':'选好了口味，抽一杯吧。';$('draw').textContent='随机一杯';$('links').classList.add('hidden')}
 else{$('drink').textContent=p.name;$('store').textContent=s.name;$('draw').textContent='再随机一杯';$('order').classList.toggle('hidden',!s.orderUrl);if(s.orderUrl)$('order').href=s.orderUrl;$('links').classList.toggle('hidden',!s.orderUrl)}
 $('draw').disabled=busy||!poolFor().length;
 if(!poolFor().length){$('drink').textContent='这个分类还没有饮品';$('store').textContent='换个口味试试。'}
 if(busy)$('draw').textContent='乌萨奇挑选中…';
}
const DRAW_ANIMATIONS=[
 {id:'hop',pose:'stand',duration:1200},
 {id:'twirl',pose:'candy',duration:1400},
 {id:'drive',pose:'car',duration:1450}
];
function chooseDrawAnimation(random=Math.random){return DRAW_ANIMATIONS[Math.floor(random()*DRAW_ANIMATIONS.length)]}
function startDrawAnimation(){
 const effect=chooseDrawAnimation();
 $('draw-scene').className='draw-scene effect-'+effect.id;
 $('draw-character').className='draw-character '+effect.pose;
 if(effect.id==='hop'){
  const poses=['stand','candy','car'];let frame=0;
  frames=setInterval(()=>{$('draw-character').className='draw-character '+poses[++frame%poses.length]},200);
 }
 timer=setTimeout(()=>endDraw(),effect.duration);
}
function endDraw(commit=true){
 clearTimeout(timer);clearInterval(frames);timer=null;frames=null;
 $('draw-scene').className='draw-scene';$('draw-character').className='draw-character stand';
 if(commit&&pending){current=pending;currentDay=today();persist()}
 pending=null;busy=false;document.body.classList.remove('busy');$('result').setAttribute('aria-busy','false');render();
}
function draw(){
 if(busy)return;
 syncDay();const pool=poolFor();if(!pool.length)return;
 const pick=pickDrink(pool,current);
 pending={store:pick.store,name:pick.name};
 if(!motion||motionQuery.matches){endDraw();return}
 busy=true;document.body.classList.add('busy');$('result').setAttribute('aria-busy','true');render();
 startDrawAnimation();
}
$('draw').onclick=draw;
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{
 if(b.dataset.category===category)return;
 if(busy)endDraw(false);
 category=b.dataset.category;
 const c=current&&ALL.find(p=>p.store===current.store&&p.name===current.name);
 if(c&&category!=='all'&&c.category!==category)current=null;
 persist();render();
});
$('motion').onchange=()=>{motion=$('motion').checked;persist();if(busy&&!motion)endDraw();render()};
motionQuery.addEventListener('change',()=>{if(busy&&motionQuery.matches)endDraw();render()});
function syncDay(){if(currentDay!==today()){if(busy)endDraw(false);current=null;currentDay=today();persist()}render()}

let horoscopeRequest=0,horoscopeDate='',horoscopeBusy=false,horoscopeLastAttempt=0;
function sourceLink(day){return 'https://www.1212.com/luck/aries/'+day.replaceAll('-','')+'.html'}
function horoscopeShell(day){
 $('fortune-date').textContent=day.replaceAll('-','.');$('fortune-source').href=sourceLink(day);
 $('fortune-details').classList.add('hidden');$('fortune-lucky').classList.add('hidden');
 $('fortune-text').textContent='正在获取今天的运势…';$('fortune-status').textContent='';$('fortune-retry').classList.add('hidden');
}
function showHoroscope(data,day,cached=false){
 if(data.sign!=='aries'||data.date!==day||!data.insights||!['综合','感情','工作','生活'].every(k=>typeof data.insights[k]==='string'&&data.insights[k].trim())||!data.color||!data.number)throw Error('Invalid horoscope');
 $('fortune-text').textContent=data.insights['综合'];
 ['感情','工作','生活'].forEach((k,i)=>{$(['fortune-love','fortune-work','fortune-life'][i]).textContent=data.insights[k]});
 $('fortune-color').textContent=data.color;$('fortune-number').textContent=data.number;
 $('fortune-details').classList.remove('hidden');$('fortune-lucky').classList.remove('hidden');
 $('fortune-status').textContent=cached?'暂时无法联网 · 显示今天已获取的内容':'今日内容 · 原文整理 · 定时更新';
 $('fortune-retry').classList.toggle('hidden',!cached);
}
async function loadHoroscope(){
 const day=today(),request=++horoscopeRequest;horoscopeDate=day;horoscopeBusy=true;horoscopeLastAttempt=Date.now();horoscopeShell(day);
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),16000);
 try{
  if(location.protocol==='file:')throw Error('Server required');
  const res=await fetch('./horoscope.json',{signal:controller.signal,cache:'no-store'});
  if(!res.ok)throw Error('Unavailable');const data=await res.json();
  if(request!==horoscopeRequest||day!==today())return;
  showHoroscope(data,day);try{localStorage.setItem('xinran-aries-cache-v2',JSON.stringify(data))}catch{}
 }catch{
  if(request!==horoscopeRequest||day!==today())return;
  let cached;try{cached=JSON.parse(localStorage.getItem('xinran-aries-cache-v2')||'null')}catch{}
  try{showHoroscope(cached,day,true)}catch{
   $('fortune-text').textContent='暂时没拿到今天的运势，稍后再试。';$('fortune-status').textContent='也可以打开星座乐查看当天内容';$('fortune-retry').classList.remove('hidden');
  }
 }finally{clearTimeout(timeout);if(request===horoscopeRequest)horoscopeBusy=false}
}
$('fortune-retry').onclick=loadHoroscope;
function refreshDay(){syncDay();if(horoscopeDate!==today()||(!horoscopeBusy&&Date.now()-horoscopeLastAttempt>900000))loadHoroscope()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshDay()});
setInterval(()=>{if(document.visibilityState==='visible')refreshDay()},30000);
render();loadHoroscope();

</script></body></html>
